{
  "name": "Bug report / 缺陷报告",
  "description": "Report a reproducible problem in this repository.",
  "title": "[Bug] ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "English or Chinese is welcome. Use the affected project's own issue tracker; this hub handles shared standards only. Search existing reports first. Never include secrets or private data. For vulnerabilities, follow the [security policy](https://github.com/tangyixiao/.github/blob/main/SECURITY.md)."
      }
    },
    {
      "type": "input",
      "id": "version",
      "attributes": {
        "label": "Version or commit",
        "description": "Include the project version or commit; for a website, include the affected page URL."
      },
      "validations": { "required": true }
    },
    {
      "type": "textarea",
      "id": "environment",
      "attributes": {
        "label": "Environment",
        "description": "Relevant operating system, browser, runtime or installation method. Write not applicable if the report concerns only text or a link."
      },
      "validations": { "required": true }
    },
    {
      "type": "textarea",
      "id": "reproduction",
      "attributes": {
        "label": "Steps to reproduce",
        "description": "Provide the smallest example or numbered steps that demonstrate the problem."
      },
      "validations": { "required": true }
    },
    {
      "type": "textarea",
      "id": "expected-actual",
      "attributes": {
        "label": "Expected and actual behavior",
        "description": "Explain what should happen and what you observed instead."
      },
      "validations": { "required": true }
    },
    {
      "type": "textarea",
      "id": "evidence",
      "attributes": {
        "label": "Relevant evidence",
        "description": "Optional short logs, screenshots or a small reproduction link. Redact secrets and personal information; avoid uploading full environments."
      }
    }
  ]
}
