<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">OJ NEXUS 手机与桌面界面布局示意</title>
<desc id="desc">手机与桌面并排展示题目浏览、平台入口、主题训练和复习队列的设计示意。平台只以文字和通用圆圈表示，题目与状态均为示例。不是应用实测截图，不代表平台连接成功、练习成绩或发布范围。</desc>
