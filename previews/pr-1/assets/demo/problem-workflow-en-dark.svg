<title id="title">Problem browsing and submission record illustration</title>
<desc id="desc">Flat graphite version. Illustration of platform tabs, search, problems, and example submissions. The compact view focuses on one problem and a record. This is a layout illustration, not an app screenshot or real user data.</desc>
