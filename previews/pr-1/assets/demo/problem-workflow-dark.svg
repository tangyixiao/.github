<svg lang="zh-CN" xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
<title id="title">题目浏览与提交记录演示</title>
<desc id="desc">中性石墨深色版本。题目浏览与提交记录示意。宽版展示平台切换、题目列表与记录摘要；窄版突出搜索、一条题目及记录示例。所有内容均为演示示意，不是应用实测截图或真实用户数据。</desc>
<defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}
.ink{fill:#e6e8ec}.muted{fill:#a3aab5}.small{font-size:18px}.body{font-size:22px}.strong{font-weight:650}
.compact-view{display:none}@media(max-width:450px){.wide-view{display:none}.compact-view{display:inline}}
</style>
